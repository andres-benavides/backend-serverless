AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AMM Purchase Approval technical challenge backend

Parameters:
  AppBaseUrl:
    Type: String
    Default: https://dominio.com
    Description: Base URL used to build the approval links sent by mail

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 10
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref PurchaseApprovalTable
        DYNAMODB_ENDPOINT: ''
        APP_BASE_URL: !Ref AppBaseUrl

Resources:
  PurchaseApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev
      TracingEnabled: true
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

  PurchaseApprovalTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  CreateRequestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/handlers/create-request.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:TransactWriteItems
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt PurchaseApprovalTable.Arn
        - Statement:
            - Effect: Allow
              Action:
                - states:StartExecution
              Resource: !Ref ApprovalStateMachine
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref ApprovalStateMachine
      Events:
        CreateRequest:
          Type: Api
          Properties:
            RestApiId: !Ref PurchaseApi
            Path: /api/requests
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true

  GetRequestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/handlers/get-request.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource: !GetAtt PurchaseApprovalTable.Arn
      Events:
        GetRequest:
          Type: Api
          Properties:
            RestApiId: !Ref PurchaseApi
            Path: /api/requests/{id}
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true

  ListRequestsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/handlers/list-requests.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource: !Sub '${PurchaseApprovalTable.Arn}/index/GSI1'
      Events:
        ListRequests:
          Type: Api
          Properties:
            RestApiId: !Ref PurchaseApi
            Path: /api/requests
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true

  GetApprovalFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/handlers/get-approval.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !GetAtt PurchaseApprovalTable.Arn
                - !Sub '${PurchaseApprovalTable.Arn}/index/GSI2'
      Events:
        GetApproval:
          Type: Api
          Properties:
            RestApiId: !Ref PurchaseApi
            Path: /api/approvals/{approvalToken}
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true

  ActivateApproverFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/handlers/activate-approver.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:UpdateItem
                - dynamodb:TransactWriteItems
                - dynamodb:PutItem
              Resource: !GetAtt PurchaseApprovalTable.Arn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true

  FinalizeRequestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/handlers/finalize-request.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt PurchaseApprovalTable.Arn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true

  ApprovalStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      DefinitionUri: statemachine/approval-flow.asl.json
      DefinitionSubstitutions:
        ActivateApproverFunctionArn: !GetAtt ActivateApproverFunction.Arn
        FinalizeRequestFunctionArn: !GetAtt FinalizeRequestFunction.Arn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !GetAtt ActivateApproverFunction.Arn
                - !GetAtt FinalizeRequestFunction.Arn
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogDelivery
                - logs:GetLogDelivery
                - logs:UpdateLogDelivery
                - logs:DeleteLogDelivery
                - logs:ListLogDeliveries
                - logs:PutResourcePolicy
                - logs:DescribeResourcePolicies
                - logs:DescribeLogGroups
              Resource: '*'
      Logging:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt ApprovalStateMachineLogGroup.Arn
        IncludeExecutionData: false
        Level: ERROR

  ApprovalStateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  ListMockMailsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/handlers/list-mock-mails.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !GetAtt PurchaseApprovalTable.Arn
                - !Sub '${PurchaseApprovalTable.Arn}/index/GSI1'
      Events:
        ListMockMails:
          Type: Api
          Properties:
            RestApiId: !Ref PurchaseApi
            Path: /mock-mail
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true

  RequestOtpFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/handlers/request-otp.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:UpdateItem
                - dynamodb:PutItem
              Resource:
                - !GetAtt PurchaseApprovalTable.Arn
                - !Sub '${PurchaseApprovalTable.Arn}/index/GSI2'
      Events:
        RequestOtp:
          Type: Api
          Properties:
            RestApiId: !Ref PurchaseApi
            Path: /api/approvals/{approvalToken}/otp
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true

  VerifyOtpFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/handlers/verify-otp.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt PurchaseApprovalTable.Arn
                - !Sub '${PurchaseApprovalTable.Arn}/index/GSI2'
      Events:
        VerifyOtp:
          Type: Api
          Properties:
            RestApiId: !Ref PurchaseApi
            Path: /api/approvals/{approvalToken}/otp/verify
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true

  SubmitDecisionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/handlers/submit-decision.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt PurchaseApprovalTable.Arn
                - !Sub '${PurchaseApprovalTable.Arn}/index/GSI2'
        - Statement:
            - Effect: Allow
              Action:
                - states:SendTaskSuccess
                - states:SendTaskFailure
              Resource: '*'
      Events:
        SubmitDecision:
          Type: Api
          Properties:
            RestApiId: !Ref PurchaseApi
            Path: /api/approvals/{approvalToken}/decision
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true

Outputs:
  ApiUrl:
    Description: REST API base URL
    Value: !Sub 'https://${PurchaseApi}.execute-api.${AWS::Region}.amazonaws.com/dev'
  TableName:
    Description: DynamoDB table name
    Value: !Ref PurchaseApprovalTable
  StateMachineArn:
    Description: Approval workflow state machine
    Value: !Ref ApprovalStateMachine
